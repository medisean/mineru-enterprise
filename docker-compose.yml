x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-worker-build: &worker-build
  context: ./backend
  dockerfile: Dockerfile.worker
  args:
    TORCH_VERSION: ${TORCH_VERSION:-2.7.0}
    HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}

x-worker-gpu-build: &worker-gpu-build
  context: ./backend
  dockerfile: Dockerfile.worker.gpu
  args:
    TORCH_VERSION: ${TORCH_VERSION:-2.7.0}
    CUDA_VERSION: ${CUDA_VERSION:-cu124}
    HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}

x-web-build: &web-build
  context: ./frontend
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-MinerU Enterprise}

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mineru}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible, optional — skip if using real S3) ─────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles: ["minio"]   # only starts when --profile minio is specified

  # ── MinIO bucket init ────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${S3_BUCKET_NAME:-mineru-enterprise};
        mc anonymous set download local/${S3_BUCKET_NAME:-mineru-enterprise};
        exit 0;
      "
    profiles: ["minio"]

  # ── Backend API ──────────────────────────────────────────────────────────────
  api:
    image: ${IMAGE_REPOSITORY:-mineru-enterprise}/api:${IMAGE_TAG:-latest}
    build: *backend-build
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mineru}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      FORCE_GPU_QUEUE: "${FORCE_GPU_QUEUE:-false}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2

  # ── Celery Worker (parse jobs) ───────────────────────────────────────────────
  worker:
    image: ${IMAGE_REPOSITORY:-mineru-enterprise}/worker:${IMAGE_TAG:-latest}
    build: *worker-build
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mineru}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      MINERU_DEVICE: "cpu"
      HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - paddleocr_models:/root/.paddleocr
      - mineru_models:/root/.mineru
      - huggingface_cache:/root/.cache/huggingface
    command: celery -A app.workers.parse_worker.celery_app worker -Q parse_cpu -c 2 --loglevel=info

  # ── Celery Worker — GPU accelerated (requires nvidia-container-toolkit) ──────
  worker-gpu:
    image: ${IMAGE_REPOSITORY:-mineru-enterprise}/worker-gpu:${IMAGE_TAG:-latest}
    build: *worker-gpu-build
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mineru}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      MINERU_DEVICE: "cuda"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - paddleocr_models:/root/.paddleocr
      - mineru_models:/root/.mineru
      - huggingface_cache:/root/.cache/huggingface
    command: celery -A app.workers.parse_worker.celery_app worker -Q parse_gpu -c 2 --loglevel=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]

  # ── Flower (Celery monitoring, optional) ────────────────────────────────────
  flower:
    image: ${IMAGE_REPOSITORY:-mineru-enterprise}/api:${IMAGE_TAG:-latest}
    build: *backend-build
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: "redis://redis:6379/1"
    ports:
      - "5555:5555"
    command: celery -A app.workers.parse_worker.celery_app flower --port=5555
    depends_on:
      - redis
    profiles: ["monitoring"]

  # ── Frontend ─────────────────────────────────────────────────────────────────
  web:
    image: ${IMAGE_REPOSITORY:-mineru-enterprise}/web:${IMAGE_TAG:-latest}
    build: *web-build
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: ${IMAGE_REPOSITORY:-mineru-enterprise}/nginx:${IMAGE_TAG:-latest}
    build:
      context: ./docker
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    profiles: ["production"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  paddleocr_models:
  mineru_models:
  huggingface_cache:
