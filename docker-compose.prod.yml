# docker-compose.prod.yml — Production override
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile gpu up -d
#
# What this does:
#   1. Forces ALL parse tasks to the GPU queue (FORCE_GPU_QUEUE=true)
#   2. Keeps the CPU worker behind the optional "cpu" profile
#   3. Enables only the GPU worker via --profile gpu
#   4. Starts Nginx reverse proxy

services:
  api:
    environment:
      FORCE_GPU_QUEUE: "true"

  worker:
    # Production does not start the CPU worker unless --profile cpu is passed.
    profiles: ["cpu"]

  worker-gpu:
    # Enabled in production by passing --profile gpu.
    profiles: ["gpu"]

  nginx:
    profiles: []
