# Local GPU-queue smoke-test override.
#
# This file keeps the production routing shape: API sends parse jobs to the
# parse_gpu queue, and a separate worker service consumes that queue. It uses
# the CPU worker image so local machines without nvidia-container-toolkit can
# still verify the frontend/API/queue/worker flow.
#
# Usage:
#   docker compose --env-file .env \
#     -f docker-compose.yml \
#     -f docker-compose.local-gpu.yml \
#     --profile minio up -d --build

services:
  api:
    environment:
      FORCE_GPU_QUEUE: "true"

  mineru-api-local:
    image: ${IMAGE_REPOSITORY:-mineru-enterprise}/worker:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
        APT_MIRROR: ${APT_MIRROR:-}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-}
        TORCH_VERSION: ${TORCH_VERSION:-2.7.0}
    restart: unless-stopped
    env_file: .env
    environment:
      MINERU_DEVICE: "cpu"
      HF_HOME: "/opt/mineru-models/huggingface"
      HUGGINGFACE_HUB_CACHE: "/opt/mineru-models/huggingface/hub"
      TRANSFORMERS_CACHE: "/opt/mineru-models/huggingface/hub"
    volumes:
      - ${MINERU_MODELS_HOST_PATH:-./backend/mineru-models}:/opt/mineru-models
      - ${MINERU_CONFIG_HOST_PATH:-./backend/mineru.json}:/root/mineru.json:ro
    command: python -m mineru.cli.fast_api --host 0.0.0.0 --port ${MINERU_API_PORT:-8000} --enable-vlm-preload ${MINERU_ENABLE_VLM_PRELOAD:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${MINERU_API_PORT:-8000}/docs >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  worker-gpu-local:
    image: ${IMAGE_REPOSITORY:-mineru-enterprise}/worker:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
        APT_MIRROR: ${APT_MIRROR:-}
        DEBIAN_APT_MIRROR: ${DEBIAN_APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
        PYTORCH_INDEX_URL: ${PYTORCH_INDEX_URL:-}
        TORCH_VERSION: ${TORCH_VERSION:-2.7.0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mineru}"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      MINERU_DEVICE: "cpu"
      MINERU_SERVER_URL: "http://mineru-api-local:${MINERU_API_PORT:-8000}"
      MINERU_API_URL: "http://mineru-api-local:${MINERU_API_PORT:-8000}"
      HF_HOME: "/opt/mineru-models/huggingface"
      HUGGINGFACE_HUB_CACHE: "/opt/mineru-models/huggingface/hub"
      TRANSFORMERS_CACHE: "/opt/mineru-models/huggingface/hub"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mineru-api-local:
        condition: service_healthy
    volumes:
      - ${MINERU_MODELS_HOST_PATH:-./backend/mineru-models}:/opt/mineru-models
      - ${MINERU_CONFIG_HOST_PATH:-./backend/mineru.json}:/root/mineru.json:ro
    command: celery -A app.workers.parse_worker.celery_app worker -Q parse_gpu -c ${GPU_WORKER_CONCURRENCY:-1} --loglevel=info
